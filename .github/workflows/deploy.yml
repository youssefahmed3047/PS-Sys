name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: "AIzaSyAIJryfM9Cl4_6bShvOivVPA8DTJ6Cn5Lo"
      VITE_FIREBASE_AUTH_DOMAIN: "playstation-app-e8511.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "playstation-app-e8511"
      VITE_FIREBASE_STORAGE_BUCKET: "playstation-app-e8511.firebasestorage.app"
      VITE_FIREBASE_MESSAGING_SENDER_ID: "26647784244"
      VITE_FIREBASE_APP_ID: "1:26647784244:web:7ea13f8682100961b71361"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
